<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>數字小銀行｜四年級數學 一億以內的數</title>
<style>
:root{--u:min(4.4vw,2.7vh,23px);--ink:#2b2a33;--ink2:#5b5a66;--sky1:#b9e3ff;--sky2:#eaf8ff;--brick:#d96c4a;--brick2:#b5502f;--y:#ffd54f;--b:#4fa3ff;--r:#ff6b6b;--g:#7bd389;--card:#fff;--line:#e3e6ee;--ok:#2fb86b;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfeaff;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:var(--u);touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(#b9e3ff 0%,#eaf8ff 60%,#fff6e0 100%)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--u)*.6) calc(var(--u)*.8) calc(var(--u)*.6)}
.scr.on{display:flex}
.cloud{position:absolute;font-size:calc(var(--u)*3);opacity:.8;animation:drift 40s linear infinite;pointer-events:none}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
/* buttons */
.btn{background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.7) calc(var(--u)*1.1);font-weight:700;box-shadow:0 .25em 0 #c9d3e6;font-size:calc(var(--u)*1.05);min-height:calc(var(--u)*2.9)}
.btn:active{transform:translateY(.15em);box-shadow:0 .1em 0 #c9d3e6}
.btn.y{background:var(--y);box-shadow:0 .25em 0 #d7a91c}
.btn.g{background:var(--g);box-shadow:0 .25em 0 #4fa95f;color:#0b3d1b}
.btn.r{background:#ffb3b3;box-shadow:0 .25em 0 #d98080}
.btn.b{background:#9ccbff;box-shadow:0 .25em 0 #6aa2e0}
.btn.big{font-size:calc(var(--u)*1.5);padding:calc(var(--u)*1)}
.bar{display:flex;gap:calc(var(--u)*.5);align-items:center;flex:none}
.bar .btn{padding:calc(var(--u)*.4) calc(var(--u)*.8);font-size:calc(var(--u)*.95);min-height:calc(var(--u)*2.4);white-space:nowrap}
.bar .sp{flex:1}
.ttl{font-weight:900;font-size:calc(var(--u)*1.3);line-height:1.15}
.sub{font-size:calc(var(--u)*.85);color:var(--ink2)}
/* cover */
#cover{align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1.2);background:linear-gradient(#8fd0ff,#eaf8ff 70%,#ffe9b0)}
#cover h1{margin:0;font-size:calc(var(--u)*2.4);line-height:1.15;text-shadow:0 .08em 0 #fff}
#cover .big-city{font-size:calc(var(--u)*5);filter:drop-shadow(0 .1em 0 #fff8)}
/* home */
#home{gap:calc(var(--u)*.4)}
#bldg{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;position:relative}
.roof{flex:none;display:flex;align-items:flex-end;justify-content:center;height:calc(var(--u)*2.4);font-size:calc(var(--u)*2);line-height:1}
.tower{flex:1;min-height:0;width:min(100%,calc(var(--u)*28));display:flex;flex-direction:column;gap:calc(var(--u)*.3);background:linear-gradient(90deg,var(--brick2),var(--brick) 12%,var(--brick) 88%,var(--brick2));padding:calc(var(--u)*.5);border-radius:calc(var(--u)*.6) calc(var(--u)*.6) 0 0;box-shadow:0 0 0 .2em #8f3d22 inset}
.floor{flex:1;min-height:0;display:flex;align-items:center;gap:calc(var(--u)*.6);background:#fff4d6;border-radius:calc(var(--u)*.5);padding:0 calc(var(--u)*.7);text-align:left;box-shadow:0 .18em 0 #c99d5a;position:relative;overflow:hidden}
.floor.done{background:#fff0a8}
.floor.next{animation:pulse 1.4s ease-in-out infinite;outline:.22em solid #fff}
.floor.boss{background:#ffd6e8;box-shadow:0 .18em 0 #d77aa7}
.floor .no{font-weight:900;font-size:calc(var(--u)*1.05);width:calc(var(--u)*2.2);height:calc(var(--u)*2.2);display:grid;place-items:center;background:var(--brick);color:#fff;border-radius:50%;flex:none}
.floor .ic{font-size:calc(var(--u)*1.5);flex:none}
.floor .nm{flex:1;min-width:0;font-weight:800;font-size:calc(var(--u)*1.05);line-height:1.1}
.floor .nm small{display:block;font-weight:500;font-size:calc(var(--u)*.72);color:var(--ink2)}
.floor .st{font-size:calc(var(--u)*.95);letter-spacing:-.1em;flex:none}
.floor:active{transform:translateY(.12em)}
@keyframes pulse{50%{transform:scale(1.02)}}
.ground{flex:none;height:calc(var(--u)*.7);width:100%;background:#7bc36b;border-radius:.3em}
.dock{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.5)}
.dock .btn{padding:calc(var(--u)*.5) calc(var(--u)*.2);font-size:calc(var(--u)*.92);line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:.1em}
.dock .btn span{font-size:calc(var(--u)*1.5)}
/* level */
.prog{display:flex;gap:calc(var(--u)*.3);flex:1;min-width:0;align-items:center}
.prog i{flex:1;height:calc(var(--u)*.8);border-radius:99px;background:#fff;box-shadow:0 0 0 .12em #c9d3e6 inset}
.prog i.ok{background:var(--ok)}.prog i.bad{background:#ffb347}.prog i.cur{background:var(--y);animation:pulse 1s infinite}
#qwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.5);margin-top:calc(var(--u)*.5)}
.card{background:var(--card);border-radius:calc(var(--u)*1);box-shadow:0 .2em 0 #c9d3e6;padding:calc(var(--u)*.7) calc(var(--u)*.9)}
.instr{font-size:calc(var(--u)*.8);color:#fff;background:#4a90e2;border-radius:99px;padding:.15em .8em;align-self:flex-start;font-weight:700}
.stem{font-size:calc(var(--u)*1.35);font-weight:800;line-height:1.35;text-align:center;flex:none}
.stem .num{font-family:"Noto Sans TC",system-ui,sans-serif;color:#d1432d;white-space:nowrap}
.fig{flex:0 1 auto;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden}
.fig svg{max-width:100%;max-height:100%}
.fig .tbl{border-collapse:collapse;font-weight:700;font-size:calc(var(--u)*1.05)}
.fig .tbl td,.fig .tbl th{border:.1em solid #9db3d9;padding:.15em .6em;text-align:center;background:#fff}
.fig .tbl th{background:#e4efff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.55);flex:none;margin-top:auto}
.opts.one{grid-template-columns:1fr}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opt{position:relative;border-radius:calc(var(--u)*1);padding:calc(var(--u)*.6) calc(var(--u)*.6);font-weight:800;font-size:calc(var(--u)*1.45);min-height:calc(var(--u)*3.6);box-shadow:0 .22em 0 rgba(0,0,0,.18);color:#1d2b3a;line-height:1.2;transition:transform .12s}
.opt.long{font-size:calc(var(--u)*1.1)}
.opt.c0{background:#ffe27a}.opt.c1{background:#9fd0ff}.opt.c2{background:#ffb1b1}.opt.c3{background:#a8e6b2}
.opt:active{transform:translateY(.15em)}
.opt.hot{outline:.25em solid #fff;transform:scale(1.04);z-index:2}
.opt.off{opacity:.35;pointer-events:none;filter:grayscale(.7)}
.opt.ok{background:var(--ok);color:#fff;animation:pop .5s}
.opt.no{animation:shake .4s}
.opt .nb{position:absolute;left:.35em;top:.25em;width:1.3em;height:1.3em;border-radius:50%;background:#fff9;font-size:.6em;display:grid;place-items:center;font-weight:900}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{20%{transform:translateX(-.3em)}60%{transform:translateX(.3em)}}
.fb{flex:none;min-height:calc(var(--u)*2.3);text-align:center;font-weight:800;font-size:calc(var(--u)*1.05);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.fb.ok{color:var(--ok)}.fb.bad{color:#c2410c}
/* numpad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*.45);flex:none;margin-top:auto}
.pad .k{background:#fff;border-radius:calc(var(--u)*.9);font-weight:900;font-size:calc(var(--u)*1.7);min-height:calc(var(--u)*3.3);box-shadow:0 .2em 0 #b8c4dc}
.pad .k:active{transform:translateY(.15em)}
.pad .k.del{background:#ffd0d0;font-size:calc(var(--u)*1.1)}
.pad .k.go{background:var(--g);font-size:calc(var(--u)*1.2)}
.ansbox{display:flex;justify-content:center;gap:calc(var(--u)*.4);flex-wrap:wrap}
.blank{min-width:calc(var(--u)*4.6);height:calc(var(--u)*2.6);border-radius:calc(var(--u)*.6);background:#fff;border:.15em dashed #8aa;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.5);padding:0 .4em}
.blank.cur{border-color:#ff9f1c;background:#fff6dc;box-shadow:0 0 0 .2em #ffd66b;animation:pulse 1s infinite}
.blank.fix{background:#e8f9ee;border:.15em solid var(--ok);color:#0b6b36}
.blank.rev{background:#fff1d0;border:.15em solid #ff9f1c}
/* chain */
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(var(--u)*.3) calc(var(--u)*.2)}
.chain .nd{min-width:calc(var(--u)*3.6);padding:.2em .5em;border-radius:99px;background:#eaf5ff;border:.12em solid #86b4e8;font-weight:800;font-size:calc(var(--u)*1.25);text-align:center}
.chain .ar{color:#6a89b5;font-weight:900}
/* cards */
.slots{display:flex;gap:calc(var(--u)*.4);justify-content:center;flex-wrap:wrap}
.slot{min-width:calc(var(--u)*3);height:calc(var(--u)*3.2);border-radius:calc(var(--u)*.6);background:#fff;border:.15em dashed #8aa;display:grid;place-items:center;font-weight:900;font-size:calc(var(--u)*1.6);padding:0 .3em}
.slot.f{background:#fff3c4;border-style:solid;border-color:#ffb400}
.hand{display:flex;gap:calc(var(--u)*.5);justify-content:center;flex-wrap:wrap;margin-top:auto}
.cardk{min-width:calc(var(--u)*3.6);height:calc(var(--u)*4.2);padding:0 .35em;border-radius:calc(var(--u)*.7);background:linear-gradient(#fff,#f0f6ff);font-weight:900;font-size:calc(var(--u)*1.8);box-shadow:0 .22em 0 #9fb3d6;border:.12em solid #bcd0ee}
.cardk.used{opacity:.25;pointer-events:none}
.cardk.sm{font-size:calc(var(--u)*1.2)}
/* compare */
.cmpbox{display:flex;gap:calc(var(--u)*.8);justify-content:center;align-items:stretch}
.cmpbox .side{flex:1;background:#fff;border-radius:calc(var(--u)*.9);box-shadow:0 .2em 0 #c9d3e6;display:grid;place-items:center;padding:calc(var(--u)*.7);font-weight:900;font-size:calc(var(--u)*1.7);text-align:center;line-height:1.2}
.cmpbox .side.l{background:#e6f1ff}.cmpbox .side.r{background:#ffeadf}
.cmpbox .side small{display:block;font-size:.5em;color:var(--ink2);font-weight:700}
/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*.3);width:min(100%,calc(var(--u)*22));margin:0 auto}
.board .h{background:#e3ecff;border-radius:.6em .6em 0 0;text-align:center;font-weight:800;font-size:calc(var(--u)*.95);padding:.15em 0}
.board .d{background:#fff;text-align:center;font-weight:900;font-size:calc(var(--u)*2.4);border-radius:0 0 .6em .6em;border:.1em solid #c8d6f0;padding:.05em 0}
.board .pm{display:flex;justify-content:center}
.board .pm button{width:100%;margin:0;background:#9ccbff;border-radius:.6em;font-weight:900;font-size:calc(var(--u)*1.3);min-height:calc(var(--u)*2.3);box-shadow:0 .15em 0 #6aa2e0}
.read{text-align:center;font-weight:800;color:#c2410c;font-size:calc(var(--u)*1.1);min-height:1.3em}
/* match */
.mt{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.5) calc(var(--u)*1.2)}
.mt button{background:#fff;border-radius:calc(var(--u)*.8);font-weight:800;font-size:calc(var(--u)*1.15);min-height:calc(var(--u)*3);box-shadow:0 .18em 0 #b8c4dc;padding:.2em .4em}
.mt button.sel{background:#fff3b0;outline:.2em solid #ffb400}
.mt button.done{background:var(--ok);color:#fff;pointer-events:none}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(20,40,80,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:calc(var(--u)*1)}
.ov.on{display:flex}
.panel{background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*1.1);width:min(100%,calc(var(--u)*26));display:flex;flex-direction:column;gap:calc(var(--u)*.6);box-shadow:0 .4em 0 #0003;max-height:100%;overflow:hidden}
.panel h2{margin:0;text-align:center;font-size:calc(var(--u)*1.5)}
.seg{display:flex;gap:calc(var(--u)*.4)}
.seg .btn{flex:1;padding:calc(var(--u)*.4) calc(var(--u)*.2);font-size:calc(var(--u)*.95)}
.seg .btn.sel{background:var(--y);box-shadow:0 .25em 0 #d7a91c}
.row{display:flex;align-items:center;gap:calc(var(--u)*.5);justify-content:space-between;font-weight:700;font-size:calc(var(--u)*1)}
/* teaching class */
#class .stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.5)}
.blkarea{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:calc(var(--u)*.4);align-content:center;justify-content:center;overflow:hidden}
.say{font-size:calc(var(--u)*1.25);font-weight:800;text-align:center;min-height:2.6em}
/* group */
.teams{display:grid;gap:calc(var(--u)*.5);flex:none}
.team{border-radius:calc(var(--u)*.8);padding:calc(var(--u)*.4) calc(var(--u)*.6);color:#222;font-weight:800;display:flex;align-items:flex-end;gap:calc(var(--u)*.5);min-height:calc(var(--u)*4)}
.team.cur{outline:.25em solid #fff;box-shadow:0 0 0 .45em #ff9f1c;transform:scale(1.03)}
.team .tw{display:flex;flex-direction:column-reverse;gap:1px;margin-left:auto;height:calc(var(--u)*3.4);justify-content:flex-start;flex-wrap:wrap-reverse;align-content:flex-start;width:50%}
.team .tw i{width:calc(var(--u)*.9);height:calc(var(--u)*.55);background:#fff8;border-radius:2px;box-shadow:0 0 0 1px #0003}
.team b{font-size:calc(var(--u)*1.5)}
/* effects */
.confe{position:fixed;top:-3em;z-index:90;pointer-events:none;font-size:calc(var(--u)*1.8);animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:95;background:#fff;border-radius:calc(var(--u)*1.2);padding:calc(var(--u)*.8) calc(var(--u)*1.4);font-weight:900;font-size:calc(var(--u)*2);box-shadow:0 .3em 0 #0003;animation:toast 1.4s forwards;pointer-events:none;text-align:center}
@keyframes toast{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.hide{display:none!important}
/* landscape */
@media (min-aspect-ratio:13/10){
 :root{--u:min(2.2vw,3.4vh)}
 #qwrap.land{display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto auto 1fr auto;column-gap:calc(var(--u)*1);row-gap:calc(var(--u)*.4)}
 #qwrap.land .opts,#qwrap.land .pad,#qwrap.land .hand{grid-column:2;grid-row:1/-1;margin-top:0;align-self:center}
 #qwrap.land>:not(.opts):not(.pad):not(.hand):not(.bdbox){grid-column:1}
 #qwrap.land>.instr{grid-row:1}
 #qwrap.land>.fb{min-height:0}
}
@media (min-aspect-ratio:13/10){
 .tower{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,1fr)}
 .dock .btn span{font-size:calc(var(--u)*1.2)}
}

.instr.ghost{display:none}
@media (min-aspect-ratio:13/10){.instr.ghost{display:block;height:0;padding:0;margin:0;overflow:hidden;visibility:hidden}}

/* ===== extra ===== */
.vbtn{white-space:nowrap}
.row2{display:flex;align-items:center;gap:calc(var(--u)*.6);flex:none;margin-top:calc(var(--u)*.4)}
.hud{font-weight:900;font-size:calc(var(--u)*1.1);white-space:nowrap;flex:none}
.hud .bump{display:inline-block;animation:bump .5s}
.hud .hp{letter-spacing:-.05em;font-size:calc(var(--u)*.95)}
@keyframes bump{40%{transform:scale(1.5)}}
.intro{margin:auto;text-align:center;display:flex;flex-direction:column;gap:calc(var(--u)*.6);padding:calc(var(--u)*2) calc(var(--u)*1.5);width:min(100%,calc(var(--u)*24));animation:pop .6s}
.bigic{font-size:calc(var(--u)*5);line-height:1}
.bigic.sad{filter:grayscale(.4)}
.floor.lock{opacity:.55;filter:grayscale(.6)}
#cover .hint{font-weight:900;font-size:calc(var(--u)*1.6);background:#fff;border-radius:99px;padding:.4em 1.4em;box-shadow:0 .2em 0 #c9d3e6;animation:pulse 1.4s infinite}
#cover .vb{position:absolute;top:calc(var(--u)*.6);right:calc(var(--u)*.8)}
#result{align-items:center;gap:calc(var(--u)*.7)}
#result .bar{align-self:stretch}
#rbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.6);text-align:center;width:min(100%,calc(var(--u)*28))}
#rbody .ttl{font-size:calc(var(--u)*1.9)}
.rsub{font-weight:700;font-size:calc(var(--u)*1.15);color:var(--ink2);line-height:1.4}
.rstars{display:flex;gap:calc(var(--u)*.4);font-size:calc(var(--u)*3.2);line-height:1}
.rstars span{color:#d4d9e4;transform:scale(.3);opacity:0;animation:starin .5s forwards}
.rstars span.on{color:#ffb400;text-shadow:0 .06em 0 #c98a00}
@keyframes starin{60%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:1}}
.pile{display:flex;flex-direction:column-reverse;gap:2px;width:calc(var(--u)*9);max-height:calc(var(--u)*7);overflow:hidden;align-items:stretch}
.pile i{height:calc(var(--u)*.55);border-radius:3px;box-shadow:0 0 0 1px #0003 inset;opacity:0;animation:drop .5s forwards}
@keyframes drop{0%{transform:translateY(-160%);opacity:0}70%{transform:translateY(8%);opacity:1}100%{transform:none;opacity:1}}
#rbtns{flex:none;display:flex;gap:calc(var(--u)*.6);flex-wrap:wrap;justify-content:center;width:100%;padding-bottom:calc(var(--u)*.4)}
#rbtns .btn{min-width:calc(var(--u)*8)}
.teams .team .tw{width:45%}
#class .stage{gap:calc(var(--u)*.4)}
.bignum{text-align:center;font-weight:900;font-size:calc(var(--u)*3);line-height:1;color:#d1432d;flex:none}
.cbtns{display:flex;gap:calc(var(--u)*.5);justify-content:center;flex-wrap:wrap;flex:none}
.cbtns .btn{flex:1;min-width:calc(var(--u)*5)}
.blkarea.flash{animation:flashb .7s}
@keyframes flashb{30%{background:#fff3b0;box-shadow:0 0 0 .3em #ffb400}}
#clsNl{flex:none;min-height:calc(var(--u)*6)}
#clsStage .seg .btn{font-size:calc(var(--u)*.8)}
#clsStage .blkarea{background:#ffffff88;border-radius:calc(var(--u)*.8)}
#clsStage .board{width:min(100%,calc(var(--u)*20))}
.ov .panel .btn.big{margin-top:calc(var(--u)*.2)}
.panel{max-height:96%;overflow:auto}
.ov .row .btn{padding:calc(var(--u)*.4) calc(var(--u)*.8)}
.ov .sub{line-height:1.4}
@media (min-aspect-ratio:13/10){
 #rbody{flex-direction:column}
 .bigic{font-size:calc(var(--u)*4)}
 .rstars{font-size:calc(var(--u)*2.6)}
 .pile{max-height:calc(var(--u)*4)}
 .intro{padding:calc(var(--u)*1) calc(var(--u)*1.5)}
}
/* ===== layout tuning ===== */
#qwrap>.fig{flex:1 1 auto}
#qwrap>.ansbox,#qwrap>.chain,#qwrap>.slots{flex:1 1 auto;align-content:center;align-items:center}
#qwrap>.cmpbox{flex:1 1 auto;max-height:calc(var(--u)*12);align-self:stretch;margin:auto 0}
.cmpbox .side{font-size:calc(var(--u)*2)}
.opt{padding-left:calc(var(--u)*1.6);padding-right:calc(var(--u)*1.6)}
.opt .nb{left:.45em;top:50%;transform:translateY(-50%);width:1.5em;height:1.5em;font-size:.62em}
.chain .nd{font-size:calc(var(--u)*1.5);min-width:calc(var(--u)*4.2)}
.chain .ar{font-size:calc(var(--u)*1.3)}

/* ===== 數字讀法（國語）===== */
const DG=['零','一','二','三','四','五','六','七','八','九'];
function zh(n){
  n=+n; if(n===10000) return '一萬'; if(n===0) return '零';
  if(n<10) return DG[n];
  if(n<20) return '十'+(n%10?DG[n%10]:'');
  const th=Math.floor(n/1000)%10,h=Math.floor(n/100)%10,t=Math.floor(n/10)%10,u=n%10;
  let s='';
  if(th) s+=DG[th]+'千';
  if(h) s+=DG[h]+'百'; else if(th&&(t||u)) s+='零';
  if(t) s+=DG[t]+'十'; else if(u&&(th||h)&&!s.endsWith('零')) s+='零';
  if(u) s+=DG[u];
  return s;
}
// 把一段文字裡的數字換成中文讀法，給語音用
function spoken(s){
  return String(s).replace(/∠/g,'角').replace(/[（(][\s　]*[）)]/g,'空格').replace(/＿+/g,'空格').replace(/□/g,'空格').replace(/(\d+)/g,(m)=>{
    if(m.length>1&&m[0]==='0') return m.split('').map(c=>DG[+c]).join('');
    const n=+m; return n<=100000000?zhBig(n):m.split('').map(c=>DG[+c]).join('');
  }).replace(/[＋+]/g,'加').replace(/[－−]/g,'減').replace(/＝/g,'等於').replace(/＞/g,'大於').replace(/＜/g,'小於').replace(/[（）()]/g,'，').replace(/\s+/g,' ');
}

const TTS={ok:'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined',gen:0,
  stop(){this.gen++;try{this.ok&&speechSynthesis.cancel()}catch(e){}},
  est(t){return Math.max(500,String(t).length*(S.rate<0.7?330:S.rate<0.9?270:210))/(TTS.mult||1)},
  one(text,gen,done){
    if(gen!==this.gen) return;
    let fin=false;const f=()=>{if(fin)return;fin=true;clearTimeout(tm);done&&done()};
    const tm=setTimeout(f,this.est(text)*1.7+900);
    try{
      const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=S.rate*(TTS.mult||1);u.pitch=1.05;
      u.onend=f;u.onerror=f;speechSynthesis.speak(u);
    }catch(e){clearTimeout(tm);setTimeout(f,this.est(text))}
  }
};
// items: [string | {t,on}]；依序唸出，每段前呼叫 on
function speakSeq(items,onAll,gap){
  TTS.stop(); const gen=TTS.gen; gap=gap==null?260:gap;
  let i=0;
  const next=()=>{
    if(gen!==TTS.gen) return;
    if(i>=items.length){onAll&&onAll();return}
    const it=items[i++],t=typeof it==='string'?it:it.t,on=typeof it==='string'?null:it.on;
    on&&on();
    const txt=spoken(t);
    if(!S.voice||!TTS.ok||!txt.trim()){later(()=>gen===TTS.gen&&next(),S.voice?TTS.est(txt)*0.5:350);return}
    TTS.one(txt,gen,()=>later(()=>gen===TTS.gen&&next(),gap));
  };
  if(CLK.paused) return;
  next();
}
function say(t,cb){speakSeq([t],cb)}

  const c=ac();if(!c||!S.sfx)return;
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime+t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t0+d);

}
function noise(t0,d,vol,hp){

  const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),da=b.getChannelData(0);for(let i=0;i<da.length;i++)da[i]=(Math.random()*2-1)*(1-i/da.length);

}

/* ================= 出題流程 ================= */
const QM={ctx:null,qs:[],idx:0,res:[],cfg:null,host:null,gen:0};
function qmStart(qs,cfg){
  QM.qs=qs;QM.idx=0;QM.res=[];QM.cfg=cfg;QM.host=cfg.host;QM.gen++;QM.pendingAdv=null;
  clearLater();TTS.stop();
  qmShow();
}
function qmDead(gen){return gen!==QM.gen}
/* 說明/解說播放時，「聽一聽」變成「下一題 ▶」，程度好的同學可直接跳過 */
function setNextBtn(on){const b=document.getElementById('lvListen');if(!b)return;b.textContent=on?'下一題':'聽一聽';b.classList.toggle('nextb',!!on)}
function qmSkip(){const a=QM.pendingAdv;if(!a)return false;TTS.stop();a();return true}
function qmProg(){
  const p=QM.cfg.prog;if(!p)return;
  p.innerHTML=QM.qs.map((_,i)=>`<i class="${i<QM.res.length?(QM.res[i]?'ok':'bad'):i===QM.idx?'cur':''}"></i>`).join('');
}
function qmShow(){
  setNextBtn(false);
  const gen=QM.gen,q=QM.qs[QM.idx];
  if(!q){QM.cfg.onEnd&&QM.cfg.onEnd(QM.res.slice());return}
  const host=QM.host;qmProg();if(!q._part2)QM.cfg.onShow&&QM.cfg.onShow(QM.idx,q);
  const ctx={maxTries:QM.cfg.maxTries||2,locked:false,
    dead:()=>qmDead(gen)||CLK.paused,
    hint(q){
      const h=q.hint||'再想一想，再試一次。';setFb(host,h,'bad');
      speakSeq([h]);
    },
    finish(first,q,revealed){
      if(qmDead(gen))return;
      const cont=q.then;if(cont){QM.p1=first&&QM.p1!==false;cont._part2=true}else{first=first&&QM.p1!==false;QM.p1=undefined;QM.res.push(first)}qmProg();
      const msg=first?pick(['答對了！','太棒了！','沒錯！','你做到了！','答案正確！']):(revealed?'看，答案是這樣：':'答對了！');
      setFb(host,(first||!revealed?msg+' ':'')+(q.why||''),first||!revealed?'ok':'bad');
      if(first||!revealed){SFX.ok();confetti(first?14:6);q.afterOk&&q.afterOk(host)}else{q.afterOk&&q.afterOk(host)}
      if(!cont)QM.cfg.onAnswer&&QM.cfg.onAnswer(first,q,!!revealed);
      const sx=q.seq?seqExplain(host,q.seq):null;
      const speakWhy=sx||(!first&&q.why),whyT=sx?sx.text:(q.whySay||q.why);
      const adv=()=>{if(qmDead(gen)||QM.pendingAdv!==adv)return;QM.pendingAdv=null;if(cont){QM.qs[QM.idx]=cont}else QM.idx++;qmShow()};
      QM.pendingAdv=adv;setNextBtn(true);
      if(sx){speakSeq(sx.items,()=>{sx.end();later(adv,1100)},200);later(adv,Math.max(4500,TTS.est(spoken(whyT))*1.5+3000))}
      else if(speakWhy){speakSeq([whyT],()=>later(adv,700));later(adv,Math.max(3000,TTS.est(spoken(whyT))*1.3+1500))}
      else{TTS.stop();later(adv,first?1250:1700)}
    }
  };
  QM.ctx=ctx;
  (REND[q.type]||rMC)(q,host,ctx);
  if(q.vert){const pe=$('.vp',host);if(pe){
    const old=ctx.speakEnd;ctx.speakEnd=()=>{old&&old();later(()=>vertRun(pe,q.vert,gen),500)};
    const bt=pe.querySelector('.vp-btn');if(bt)bt.onclick=()=>{if(!guard(300)||CLK.paused)return;TTS.stop();vertRun(pe,q.vert,gen)};
  }}
  ctx.replay=()=>{if(CLK.paused||QM.pendingAdv)return;const items=(ctx.speakHead||[]).concat(ctx.speakTail||[]);speakSeq(items,ctx.speakEnd)};
  // 第一次自動唸題
  later(()=>{if(qmDead(gen))return;ctx.replay()},300);
}
function qmReplay(){QM.ctx&&QM.ctx.replay&&QM.ctx.replay()}
function qmResume(){if(QM.pendingAdv&&!CLK.paused){later(QM.pendingAdv,500)}}

function zhBig(n){

/* ================= 直式加減（任意位數，一位一位填） ================= */

        st.say=`${pn}：${parts.join('加')}${c?'，再加進位的1':''}，等於${s}。${s}是10加${u}，${u}寫在${pn}，1進位到${nx}。`;st.short=`${u}寫在${pn}，1進位。`}
      else{st.L.push({t:`${s} 寫在${pn}`,ans:1});st.say=`${pn}：${parts.join('加')}${c?'，再加進位的1':''}，等於${s}，寫${s}。`;st.short=c?`加進位的1，寫${s}。`:''}

        st.say=bP?`${pn}：${lent?'剩'+W[p]+'，':''}${W[p]}減${bd}，等於${W[p]-bd}。`:`${pn}：下面沒有數，直接寫${W[p]}。`;st.short=lent?`剩${W[p]}，減${bd}，等於${W[p]-bd}。`:''}

/* ================= 題型：□裡可以填哪些數字（可複選） ================= */
function rPick(q,host,ctx){
  q.fig=q.fig||null;buildShell(q,host,ctx);
  const box=document.createElement('div');box.className='digpick';
  box.innerHTML=Array.from({length:10},(_,i)=>`<button class="dp" data-v="${i}">${i}</button>`).join('');
  host.appendChild(box);fbEl(host);
  const bx=document.createElement('div');bx.className='bdbox';bx.innerHTML=`<button class="btn g big" id="dpGo">選好了</button>`;host.appendChild(bx);
  const sel=new Set();let tries=0,locked=false;const ans=q.ans.slice().sort().join(',');
  box.querySelectorAll('.dp').forEach(b=>b.onclick=()=>{if(locked||ctx.dead())return;const v=+b.dataset.v;if(sel.has(v)){sel.delete(v);b.classList.remove('sel')}else{sel.add(v);b.classList.add('sel')}SFX.tap()});
  const go=bx.querySelector('#dpGo');
  go.onclick=()=>{if(locked||ctx.dead()||!guard(300))return;TTS.stop();
    if([...sel].sort().join(',')===ans){locked=true;ctx.finish(tries===0,q)}
    else{tries++;SFX.bad();
      if(tries>=ctx.maxTries){locked=true;box.querySelectorAll('.dp').forEach(b=>{const v=+b.dataset.v;b.classList.toggle('sel',q.ans.includes(v));b.classList.toggle('ok',q.ans.includes(v))});ctx.finish(false,q,true)}
      else{const miss=q.ans.filter(v=>!sel.has(v)).length,extra=[...sel].filter(v=>!q.ans.includes(v)).length;const t=extra?'有選錯的數字，再試試看。':`還少選了${miss}個數字。`;setFb(host,t,'bad');speakSeq([t+(q.hint||'')]);ctx.wrong1&&ctx.wrong1()}}};
  ctx.auto=()=>{sel.clear();q.ans.forEach(v=>sel.add(v));_lastTap=0;go.onclick()};
  ctx.autoWrong=()=>{if(locked)return false;sel.clear();sel.add(q.ans[0]);_lastTap=0;go.onclick();return true};
  ctx.speakTail=[];ctx.speakEnd=()=>{};
}

    if(e.ten===2)steps.push({t:'10個一百萬是一千萬，10個一千萬是一億，所以一億是100個一百萬，是100倍。',on:()=>{pnl.querySelector('.ex-ans').textContent='1億 ＝ 100個百萬 → 100倍'}});
    if(e.ten===3)steps.push({t:'10個1000是10000。100個1000，就是10個10000，是100000。',on:()=>{pnl.querySelector('.ex-ans').textContent='100個1000 ＝ 10個10000 ＝ 100000'}});
    if(e.pv)steps.push({t:'幾個千萬，就在千萬位放幾；幾個萬，就在萬位放幾。沒有的位，放0。',on:()=>{pnl.querySelector('.ex-ans').innerHTML=pvHTML(tot,8)}});

  }else if(e.kind!=='seq'){
    body=exBuild(q,e,pnl,steps,calcs);
  }else if(e.kind==='seq'){
    body=`<div class="ex-seq">${e.arr.map((v,i)=>`<span class="sq" data-i="${i}">${e.bl.includes(i)?'？':v}</span>`).join('<b>→</b>')}</div><div class="ex-v"></div><div class="ex-ans"></div>`;
    steps.push({t:`每一次，都多${zhBig(e.st)}。用直式加加看。`,on:()=>{}});
  }
  pnl.innerHTML=`<h2>教我怎麼算</h2><div class="exbody">${body}</div><div class="les-btns"><button class="btn" id="exAgain">再看一次</button><button class="btn g big" id="exBack">回去作答</button></div>`;
  const close=()=>{TTS.stop();ov._tok++;ov.classList.remove('on')};
  pnl.querySelector('#exBack').onclick=close;
  pnl.querySelector('#exAgain').onclick=()=>{if(guard(300)){close();later(()=>showExplain(q),150)}};
  ov.classList.add('on');
  const run=items=>{const out=[];items.forEach(x=>out.push({t:x.t,on:()=>{if(alive())x.on()}}));return out};
  if(e.kind==='seq'){
    let i=0;const nextOne=()=>{if(!alive())return;if(i>=e.bl.length){pnl.querySelector('.ex-ans').textContent='答案：'+e.bl.map(j=>e.arr[j]).join('、');speakSeq(['想好了，就按「回去作答」。']);pnl.querySelector('#exBack').classList.add('pulse');return}
      const j=e.bl[i],a=e.arr[j-1],v=pnl.querySelector('.ex-v');v.innerHTML='';const api=bigMount(v,a,e.st,1,{});
      api.demo(()=>{if(!alive())return;const sq=pnl.querySelector(`.sq[data-i="${j}"]`);sq.textContent=e.arr[j];sq.classList.add('ok');i++;later(nextOne,900)},alive)};
    speakSeq(run(steps),()=>later(nextOne,300));return;
  }
  const fin=()=>{if(!alive())return;pnl.querySelector('#exBack').classList.add('pulse');speakSeq(['想好了，就按「回去作答」。'])};
  let ci=0;const nextCalc=()=>{if(!alive())return;if(ci>=calcs.length)return fin();const c=calcs[ci++],v=pnl.querySelector('.ex-v');v.innerHTML=`<div class="cl-lab">${esc(c.label||'')}</div>`;const api=bigMount(v,c.a,c.b,c.sign,{unit:c.unit});
    const go=()=>api.demo(()=>{if(!alive())return;const ea=pnl.querySelector('.ex-ans');if(ea&&calcs.length>1)ea.textContent=(ea.textContent?ea.textContent+'　':'')+`${c.a}${c.unit||''}${c.sign>0?'＋':'－'}${c.b}${c.unit||''}＝${c.a+c.sign*c.b}${c.unit||''}`;later(nextCalc,900)},alive);
    if(c.label)speakSeq([c.label],go);else go()};
  speakSeq(run(steps),()=>{if(calcs.length)later(nextCalc,300);else fin()},140);
}

function exFor(q){if(q.explain)return q.explain;const st=q.stem||'';for(const [k,e] of EXMAP)if(st.includes(k))return e;return {kind:'text'}}
function pvCols(pnl,p,on){pnl.querySelectorAll('.pv [data-p].hl').forEach(x=>x.classList.remove('hl'));if(on!==false&&p!=null)pnl.querySelectorAll(`.pv [data-p="${p}"]`).forEach(x=>x.classList.add('hl'))}
function exBuild(q,e,pnl,steps,calcs){
  const A=()=>pnl.querySelector('.ex-ans');
  if(e.kind==='pvwalk'){
    const d=digAt(e.n,e.p),v=d*Math.pow(10,e.p);
    steps.push({t:'從最右邊的個位開始，一位一位往左數。',on:()=>{}});
    for(let k=0;k<=e.p;k++)steps.push({t:PNW[k],gap:150,on:()=>pvCols(pnl,k)});
    steps.push({t:`${PNW[e.p]}的數字是${d}。`,on:()=>{A().textContent=`${PNW[e.p]}的數字是 ${d}`}});
    if(e.value)steps.push({t:`${d}在${PNW[e.p]}，表示${d}個${unitName(Math.pow(10,e.p))}，就是${zhBig(v)}。`,on:()=>{A().innerHTML=`${d} 個${unitName(Math.pow(10,e.p))} ＝ <b class="big">${d}<span class="zz">${'0'.repeat(e.p)}</span></b>`}});
    return `${pvHTML(e.n,e.L||Math.max(ld(e.n),5))}<div class="ex-ans"></div>`;
  }
  if(e.kind==='digits'){
    const s=String(e.n);
    steps.push({t:`${zhBig(e.n)}寫成數字是${s.split('').map(c=>DG[+c]).join('')}。一個一個數，有幾個數字？`,on:()=>{}});
    s.split('').forEach((c,i)=>steps.push({t:String(i+1),gap:150,on:()=>{pnl.querySelector(`.dg[data-i="${i}"]`).classList.add('on');pnl.querySelector(`.dg[data-i="${i}"] small`).textContent=i+1}}));
    steps.push({t:`有${s.length}個數字，是${s.length}位數。`,on:()=>{A().textContent=`${s.length} 個數字 → ${s.length}位數`}});
    return `<div class="dgs">${s.split('').map((c,i)=>`<span class="dg" data-i="${i}">${c}<small></small></span>`).join('')}</div><div class="ex-ans"></div>`;
  }
  if(e.kind==='read'){
    const n=e.n,hi=Math.floor(n/10000),lo=n%10000;
    if(n===100000000){steps.push({t:'10個一千萬，就是一億。一後面有8個0，讀作一億。',on:()=>{A().textContent='100000000 讀作 一億'}});return `${pvHTML(n,9)}<div class="ex-ans"></div>`}
    const loS=hi?String(lo).padStart(4,'0'):String(lo);
    steps.push({t:'從個位開始，每4個數字一組，用線分開。',on:()=>{pnl.querySelector('.grps').classList.add('cut')}});
    if(hi){steps.push({t:`前面這一組是${String(hi).split('').map(c=>DG[+c]).join('')}，讀作${zh4(hi)}，後面要加一個「萬」。`,on:()=>{pnl.querySelector('.g1').classList.add('on');pnl.querySelector('.r1').textContent=zh4(hi)+'萬'}});
      if(/[1-9]0+[1-9]/.test(String(hi)))steps.push({t:'這一組中間有連續的0，只讀一個零。',on:()=>{}});
      if(/[1-9]0+$/.test(String(hi)))steps.push({t:'這一組後面的0，不用讀。',on:()=>{}});}
    if(lo===0&&hi)steps.push({t:'後面這一組全部都是0，都不用讀。',on:()=>{pnl.querySelector('.g0').classList.add('on');pnl.querySelector('.r0').textContent='（不讀）'}});
    else{
      if(hi&&lo<1000)steps.push({t:'後面這一組，前面有0，要讀一個「零」。',on:()=>{pnl.querySelector('.g0').classList.add('on')}});
      steps.push({t:`後面這一組，讀作${(hi&&lo<1000?'零':'')+zh4(lo,!!hi)}。`,on:()=>{pnl.querySelector('.g0').classList.add('on');pnl.querySelector('.r0').textContent=(hi&&lo<1000?'零':'')+zh4(lo,!!hi)}});
      if(/[1-9]0+[1-9]/.test(String(lo)))steps.push({t:'中間有連續的0，只讀一個零。',on:()=>{}});
      if(/[1-9]0+$/.test(String(lo)))steps.push({t:'後面的0，不用讀。',on:()=>{}});
    }
    steps.push({t:`合起來，讀作${zhBig(n)}。`,on:()=>{A().textContent=`讀作：${zhBig(n)}`}});
    return `<div class="grps">${hi?`<div class="gp g1"><b>${hi}</b><small class="r1"></small></div><div class="gcut"></div>`:''}<div class="gp g0"><b>${loS}</b><small class="r0"></small></div></div><div class="ex-ans"></div>`;
  }
  if(e.kind==='write'){
    const n=e.n,hi=Math.floor(n/10000),lo=n%10000,ch=zhBig(n),wi=ch.indexOf('萬');
    const loS=hi?String(lo).padStart(4,'0'):String(lo),hiS=hi?String(hi):'';
    const boxes=(str,cls,lab)=>`<div class="wb ${cls}">${str.split('').map((c,i)=>`<span class="wc" data-c="${c}"><small>${lab[lab.length-str.length+i]}</small><b></b></span>`).join('')}</div>`;
    if(hi){steps.push({t:`先找到「萬」這個字。`,on:()=>{pnl.querySelector('.chw').classList.add('on')}});
      steps.push({t:`萬的前面是${zh4(hi)}，寫成${hi}。`,on:()=>{pnl.querySelectorAll('.wb.h .wc').forEach(c=>c.querySelector('b').textContent=c.dataset.c)}});
      steps.push({t:lo?`萬的後面是${zh4(lo,true).replace(/^零/,'')}，一定要寫滿4格：千、百、十、個。沒有的位，寫0。`:'萬的後面什麼都沒有，4格都寫0。',on:()=>{}});}
    else steps.push({t:`${ch}，照千、百、十、個寫下來，沒有的位寫0。`,on:()=>{}});
    loS.split('').forEach((c,i)=>{const lab=['千位','百位','十位','個位'][4-loS.length+i];steps.push({t:`${lab}：${c==='0'?'沒有，寫0':'寫'+c}`,gap:150,on:()=>{const w=pnl.querySelectorAll('.wb.l .wc')[i];w.querySelector('b').textContent=c;w.classList.add('on')}})});
    steps.push({t:`合起來，寫成${String(n).split('').map(c=>DG[+c]).join('')}。`,on:()=>{A().textContent=`寫成：${n}`}});
    return `<div class="chs">${hi?ch.slice(0,wi):''}<span class="chw">${hi?'萬':''}</span>${hi?ch.slice(wi+1):ch}</div><div class="wbs">${hi?boxes(hiS,'h',['千萬','百萬','十萬','萬']):''}${boxes(loS,'l',['千','百','十','個'])}</div><div class="ex-ans"></div>`;
  }
  if(e.kind==='cmp'){
    const a=e.a,b=e.b,L=Math.max(ld(a),ld(b));
    steps.push({t:'把兩個數，放進定位板對齊。',on:()=>{}});
    steps.push({t:`上面是${ld(a)}位數，下面是${ld(b)}位數。`,on:()=>{}});
    if(ld(a)!==ld(b))steps.push({t:`位數多的比較大，所以${ld(a)>ld(b)?'上面':'下面'}的${zhBig(Math.max(a,b))}比較大。`,on:()=>{A().textContent=`${Math.max(a,b)} 比較大`}});
    else{steps.push({t:'位數一樣，從最左邊開始，一位一位比。',on:()=>{}});
      for(let k=L-1;k>=0;k--){const x=digAt(a,k),y=digAt(b,k);
        if(x===y){steps.push({t:`${PNW[k]}都是${x}，一樣。`,gap:150,on:()=>pvCols(pnl,k)});if(k===0)steps.push({t:'每一位都一樣，兩個數一樣大。',on:()=>{A().textContent='一樣大'}})}
        else{steps.push({t:`${PNW[k]}：${x}和${y}，${Math.max(x,y)}比較大。`,on:()=>pvCols(pnl,k)});steps.push({t:`所以${x>y?'上面':'下面'}的數比較大。`,on:()=>{A().textContent=`${Math.max(a,b)} 比較大`}});break}}}
    return `<div class="pvpair">${pvHTML(a,L)}${pvHTML(b,L)}</div><div class="ex-ans"></div>`;
  }
  if(e.kind==='box'){
    const s0=e.s,b=e.b,L=Math.max(s0.length,ld(b)),bi=s0.indexOf('□'),p=s0.length-1-bi,bd=digAt(b,p),gt=e.op==='>';
    const ok=d=>{const v=+s0.replace('□',d);return gt?v>b:v<b};
    const eqOK=ok(bd);
    steps.push({t:'把兩個數上下對齊。',on:()=>{}});
    if(bi>0)steps.push({t:`□前面的數字，上下都一樣。`,on:()=>{for(let k=s0.length-1;k>p;k--)pnl.querySelectorAll(`.pv [data-p="${k}"]`).forEach(x=>x.classList.add('same'))}});
    steps.push({t:`□在${PNW[p]}，下面這一位是${bd}。`,on:()=>pvCols(pnl,p)});
    const mark=(fn,cls)=>{for(let d=0;d<10;d++)if(fn(d))pnl.querySelector(`.dpx[data-v="${d}"]`).classList.add(cls)};
    if(gt){steps.push({t:`□比${bd}大，上面一定比較大，可以填。`,on:()=>mark(d=>d>bd,'y')});
      steps.push({t:`□比${bd}小，上面就比較小，不可以。`,on:()=>mark(d=>d<bd,'n')});}
    else{steps.push({t:`□比${bd}小，上面一定比較小，可以填。`,on:()=>mark(d=>d<bd,'y')});
      steps.push({t:`□比${bd}大，上面就比較大，不可以。`,on:()=>mark(d=>d>bd,'n')});}
    steps.push({t:`□剛好是${bd}的時候，要再比後面：${eqOK?'這樣也可以':'這樣不可以'}。`,on:()=>mark(d=>d===bd,eqOK?'y':'n')});
    const ans=[];for(let d=0;d<10;d++)if(ok(d))ans.push(d);

    const top=s0.replace('□','0');

  }
  if(e.kind==='order'){
    const ns=e.ns,L=Math.max(...ns.map(ld)),sorted=ns.slice().sort((x,y)=>e.big?y-x:x-y);
    steps.push({t:'先比位數，位數多的比較大；位數一樣，從最左邊開始比。',on:()=>{}});
    sorted.forEach((v,i)=>steps.push({t:`第${i+1}個是${zhBig(v)}。`,on:()=>{const r=pnl.querySelector(`.ord [data-v="${v}"]`);r.style.order=i;r.classList.add('on')}}));
    return `<div class="ord">${ns.map(v=>`<div data-v="${v}">${pvHTML(v,L)}</div>`).join('')}</div><div class="ex-ans"></div>`;
  }
  if(e.kind==='cards'){
    const ds=e.ds,v=String(e.v);
    steps.push({t:e.big?'要排最大的數：最大的數字，放在最左邊，再一個一個放比較小的。':'要排最小的數：0不能放在最前面，先放最小的、不是0的數字，再從小到大放。',on:()=>{}});
    v.split('').forEach((c,i)=>steps.push({t:`第${i+1}格，放${c}`,gap:150,on:()=>{pnl.querySelectorAll('.cs')[i].textContent=c;const used=[...pnl.querySelectorAll('.dcard:not(.used)')].find(x=>x.textContent===c);used&&used.classList.add('used')}}));
    steps.push({t:`排好了，是${zhBig(e.v)}。`,on:()=>{A().textContent=`${e.big?'最大':'最小'}：${e.v}`}});
    return `<div class="dcards">${ds.map(d=>`<span class="dcard">${d}</span>`).join('')}</div><div class="cslots">${v.split('').map(()=>'<span class="cs"></span>').join('')}</div><div class="ex-ans"></div>`;
  }
  if(e.kind==='bar'){
    const {a,b,sign}=e,u=e.unit||'',W=100,big=Math.max(a,b,sign>0?a+b:a);
    const wa=Math.round(a/(sign>0?a+b:a)*W),wb=Math.round(b/(sign>0?a+b:a)*W);
    let svg;
    if(sign>0)svg=`<div class="xbar"><div class="bt">？</div><div class="br"><span class="ba" style="width:${wa}%">${a}</span><span class="bb" style="width:${W-wa}%">${b}</span></div></div>`;
    else svg=`<div class="xbar"><div class="bt">${a}</div><div class="br"><span class="bq" style="width:${W-wb}%">？</span><span class="bb cut" style="width:${wb}%">${b}</span></div></div>`;
    steps.push({t:sign>0?`把${zhBig(a)}和${zhBig(b)}兩段接起來，問全部有多少。`:`全部是${zhBig(a)}，拿掉${zhBig(b)}這一段，問剩下的有多少。`,on:()=>pnl.querySelector('.xbar').classList.add('on')});
    steps.push({t:sign>0?'合在一起，所以用加法。':'從全部拿掉一段，所以用減法。',on:()=>{A().textContent=sign>0?'合起來 → 用加法 ＋':'拿掉、相差 → 用減法 －'}});
    calcs.push({a,b,sign,unit:'',label:'用直式算算看'});
    return `${svg}<div class="ex-ans"></div><div class="ex-v"></div>`;
  }
  if(e.kind==='calc'){(e.list||[]).forEach(c=>calcs.push(c));return `<div class="ex-ans"></div><div class="ex-v"></div>`}
  // text fallback：用題目的圖和解答
  const why=q.why||'';
  why.split(/(?<=[。！])/).filter(x=>x.trim()).forEach((t,i)=>steps.push({t,on:()=>{const li=pnl.querySelectorAll('.exl li')[i];li&&li.classList.add('on')}}));
  return `${q.fig?`<div class="exfig">${typeof q.fig==='string'?q.fig:q.fig.html||''}</div>`:''}<ol class="exl hlines">${why.split(/(?<=[。！])/).filter(x=>x.trim()).map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`;
}

function mkGroupQs(total){
  const rg={basic:[0,1,2],mid:[3,4,5],high:[6,7,8],all:[0,1,2,3,4,5,6,7,8]}[GCFG.range];
  const tiers=GCFG.range==='basic'?[1,2]:[2,3],out=[];
  let last=-1;
  for(let i=0;i<total;i++){
    let qi=null;
    for(let t=0;t<10&&!qi;t++){
      let li;do{li=pick(rg)}while(li===last&&rg.length>1);
      const lv=LV[li],tier=pick(tiers),pool=lv.mk.filter(x=>x[0]===tier).map(x=>x[1]);
      const q=tryMake(pick(pool),SEEN);if(q&&!q.noGroup){qi=q;last=li}
    }
    if(qi)out.push(qi);
  }
  return out;
}

function clsExchange(st){
  st.innerHTML=`<div class="cl-a"><div class="say" id="clsSay">按一按，加積木。滿10個，就要換成大一級的！</div><div class="bignum" id="clsNum">0</div><div class="read" id="clsRead"></div></div><div class="cl-b"><div class="blkarea" id="clsBlk"></div>

  const upd=(msg,flash)=>{
    const n=CLS.big?10000:clsNum();
    $('#clsNum').textContent=n;$('#clsRead').textContent=n?'讀作：'+zh(n):'';
    const a=$('#clsBlk');a.innerHTML=clsBlocks(n);

  const unitNm=['千','百','十','一'];
  $$('#clsStage .cbtns [data-i]').forEach(b=>b.onclick=()=>{
    if(!guard(250))return;
    if(CLS.big){toast('已經是一萬了！');SFX.bad();return}

      CLS.d[i-1]++;msgs.push(`10個${unitNm[i]}，換成1個${unitNm[i-1]}！`);i--;

function clsLine(st){
  const steps=[1,10,100,1000];
  st.innerHTML=`<div class="cl-a"><div class="say" id="clsSay">選一格有多大，再按左右，讓小青蛙跳一跳。</div>
  <div class="seg" id="clsStep">${steps.map(s=>`<button class="btn ${CLS.step===s?'sel':''}" data-s="${s}">一格＝${s}</button>`).join('')}</div><div class="bignum" id="clsNum">0</div><div class="read" id="clsRead"></div></div>
  <div class="cl-b"><div class="fig" id="clsNl"></div>
  <div class="cbtns"><button class="btn r big" id="clsL">◀ 往左</button><button class="btn g big" id="clsR">往右 ▶</button></div></div>`;
  const W=290;
  const draw=(anim)=>{
    const s=CLS.step,f=numberLine({from:0,to:10*s,step:s,show:Object.fromEntries(Array.from({length:11},(_,i)=>[i*s,String(i*s)])),W,fs:s>=1000?9.5:10.5,marker:{e:'🐸',at:anim?CLS.prev:CLS.v}});
    $('#clsNl').innerHTML=f;
    if(anim){requestAnimationFrame(()=>requestAnimationFrame(()=>{const m=$('#clsNl .mk');if(m)m.style.transform=`translateX(${nlX(0,10*s,W,CLS.v)}px)`}))}
    $('#clsNum').textContent=CLS.v;$('#clsRead').textContent=CLS.v?'讀作：'+zh(CLS.v):'';
  };
  const move=dir=>{
    if(!guard(300))return;const s=CLS.step,nv=CLS.v+dir*s;
    if(nv<0||nv>10*s){SFX.bad();toast(nv<0?'左邊沒有了':'右邊到頭了');return}
    CLS.prev=CLS.v;CLS.v=nv;SFX.place();draw(true);
    const msg=`${dir>0?'往右':'往左'}一格，${dir>0?CLS.prev+'加'+s:CLS.prev+'減'+s}，是${nv}`;
    $('#clsSay').textContent=msg.replace('是',' ＝ ');
    speakSeq([msg]);
  };
  $('#clsL').onclick=()=>move(-1);$('#clsR').onclick=()=>move(1);
  $$('#clsStep .btn').forEach(b=>b.onclick=()=>{CLS.step=+b.dataset.s;CLS.v=0;SFX.tap();renderClass()});

  draw(false);

// 等歡迎的語音完整唸完，再停一下，才跳出選角色（不打斷歡迎詞）
function waitQuiet(cb){
  let quiet=0,t0=Date.now();
  const busy=()=>{try{return S.voice&&TTS.ok&&(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){return false}};
  const tick=()=>{
    if(CURSCR!=='home'){PT.asked=false;return}
    if(CLK&&CLK.paused){setTimeout(tick,400);return}
    quiet=busy()?0:quiet+400;
    if(quiet>=1600&&Date.now()-t0>=(S.voice?2500:3000))return cb();

<script>
(function(){
'use strict';
const GEN='A', KEYP='m';
const qa=(s,r)=>[...(r||document).querySelectorAll(s)];

/* ---------- 1. 解說圖、上課畫面：內容太大時自動縮小，不會被切掉 ---------- */
document.documentElement.classList.add('gen'+GEN);
const BOX='.les-stage,.clsfig,#lsStage,.les-scene'+(GEN==='C'?',.exbody>.exfig':'');
function measure(kids){let t=1e9,b=-1e9,l=1e9,r=-1e9;kids.forEach(k=>{const R=k.getBoundingClientRect();if(!R.width&&!R.height)return;t=Math.min(t,R.top);b=Math.max(b,R.bottom);l=Math.min(l,R.left);r=Math.max(r,R.right)});return b<t?[0,0]:[b-t,r-l]}
function fitBox(c){
  if(!c.offsetParent)return;
  const kids=[...c.children].filter(k=>{const p=getComputedStyle(k).position;return p!=='absolute'&&p!=='fixed'});
  if(!kids.length)return;
  kids.forEach(k=>{if(k.style.zoom)k.style.zoom=''});
  const cs=getComputedStyle(c),aH=c.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-4,aW=c.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-4;
  if(aH<20||aW<20)return;
  let [h,w]=measure(kids);if(!h||(h<=aH+1&&w<=aW+1))return;
  let z=Math.max(.4,Math.min(1,aH/h,aW/w));
  for(let i=0;i<5;i++){kids.forEach(k=>k.style.zoom=z.toFixed(3));[h,w]=measure(kids);if((h<=aH+1&&w<=aW+1)||z<=.4)break;z=Math.max(.4,z*Math.min(.95,aH/h,aW/w))}
}
function fitScroll(c){ // 解說視窗：圖太大時，把圖縮小，讓字也看得到
  if(!c.offsetParent)return;
  const f=c.querySelector(':scope>.exfig');if(!f)return;
  if(f.style.zoom)f.style.zoom='';
  if(c.scrollHeight<=c.clientHeight+2)return;
  let z=1;
  for(let i=0;i<6;i++){z=Math.max(.5,z*Math.min(.93,c.clientHeight/c.scrollHeight));f.style.zoom=z.toFixed(3);if(c.scrollHeight<=c.clientHeight+2||z<=.5)break}
}
let fitQ=0;
function fitAll(){fitQ=0;try{qa(BOX).forEach(fitBox);if(GEN!=='C')qa('.exbody').forEach(fitScroll)}catch(e){}}
function fitSoon(){if(!fitQ)fitQ=requestAnimationFrame(()=>requestAnimationFrame(fitAll))}
try{new MutationObserver(fitSoon).observe(document.getElementById('app')||document.body,{childList:true,subtree:true})}catch(e){}
window.addEventListener('resize',fitSoon);
window.addEventListener('orientationchange',()=>setTimeout(fitSoon,300));
window.__fitAll=fitAll;

/* ---------- 2. 暫停、速度按鈕都加上文字 ---------- */
if(GEN==='C'&&typeof spSync==='function'){
  const _sp=spSync;
  spSync=function(){
    _sp();
    const k=spdIdx(),lab=SPD[k][1];
    qa('.psbtn[data-short]').forEach(b=>{b.innerHTML=SP.paused?'▶ 繼續':'✋ 暫停'});
    qa('.spdbtn[data-short]').forEach(b=>{b.innerHTML=`<span class="sl">說話速度</span><span class="sv">${lab}</span>`;b.title='按一下，換說話速度'});
    qa('.spdbtn:not([data-short])').forEach(b=>{b.innerHTML=`說話速度：${lab}`});
  };
  setTimeout(()=>{try{spSync()}catch(e){}},50);
}

/* ---------- 3. 四年級版本：補上「可以暫停的語音」和速度按鈕 ---------- */
if(GEN==='A'){
  window.SP2={paused:false,cur:null};
  const SPD2=[[0.62,'🐢 慢'],[0.8,'🚶 普通'],[1.0,'🐇 快']];
  const idx=()=>{let k=0,d=9;SPD2.forEach((x,i)=>{const dd=Math.abs(x[0]-S.rate);if(dd<d){d=dd;k=i}});return k};
  speakSeq=function(items,onAll,gap){
    TTS.stop();const gen=TTS.gen;gap=gap==null?260:gap;SP2.paused=false;
    const st={items,i:0,onAll,gap,gen,called:-1,waiting:false,ep:0};SP2.cur=st;sync();
    const next=()=>{
      if(gen!==TTS.gen)return;
      if(SP2.paused){st.waiting=true;return}
      if(st.i>=items.length){if(SP2.cur===st){SP2.cur=null;sync()}onAll&&onAll();return}
      const it=items[st.i],t=typeof it==='string'?it:it.t,on=typeof it==='string'?null:it.on;
      if(st.called<st.i){st.called=st.i;on&&on()}
      const txt=spoken(t),ep=st.ep;
      const done=()=>{if(gen!==TTS.gen||ep!==st.ep)return;if(SP2.paused){st.waiting=true;return}st.i++;later(()=>{if(gen===TTS.gen&&ep===st.ep)next()},gap)};
      if(!S.voice||!TTS.ok||!txt.trim()){later(done,S.voice?TTS.est(txt)*0.5:350);return}
      TTS.one(txt,gen,done);
    };
    st.next=next;if(CLK.paused)return;next();
  };
  say=function(t,cb){speakSeq([t],cb)};
  function pause(){const c=SP2.cur;if(!c)return;SP2.paused=true;c.ep++;c.waiting=true;try{TTS.ok&&speechSynthesis.cancel()}catch(e){}sync()}
  function resume(){SP2.paused=false;sync();const c=SP2.cur;if(c&&c.waiting&&c.gen===TTS.gen){c.waiting=false;c.next()}}
  function setSpd(k){S.rate=SPD2[k][0];sync();try{SFX.tap()}catch(e){}
    const c=SP2.cur;
    if(c&&!SP2.paused&&c.gen===TTS.gen){c.ep++;try{TTS.ok&&speechSynthesis.cancel()}catch(e){}setTimeout(()=>{if(SP2.cur===c&&!SP2.paused)c.next()},150)}
    else if(!c)speakSeq([['這樣唸，比較慢。','這樣唸，是普通的速度。','這樣唸，比較快。'][k]]);
    qa('#spSeg .btn').forEach(b=>b.classList.toggle('sel',Math.abs(+b.dataset.v-S.rate)<.01));
  }
  function sync(){
    qa('.psbtn').forEach(b=>{b.textContent=SP2.paused?'▶ 繼續':'✋ 暫停';b.classList.toggle('y',SP2.paused)});
    const k=idx();
    qa('.spd2').forEach(b=>b.classList.toggle('sel',+b.dataset.i===k));
    qa('.spdbtn').forEach(b=>{b.innerHTML=`<span class="sl">說話速度</span><span class="sv">${SPD2[k][1]}</span>`});
  }
  window.spSync2=sync;
  const BAR2='<div class="spbar2"><button class="btn psbtn">✋ 暫停</button><span class="spl">說話速度</span>'+SPD2.map((x,i)=>`<button class="btn spd2" data-i="${i}">${x[1]}</button>`).join('')+'</div>';
  document.addEventListener('click',e=>{const b=e.target.closest('.psbtn,.spd2,.spdbtn');if(!b)return;e.stopPropagation();if(!guard(250))return;
    if(b.classList.contains('psbtn')){if(SP2.paused)resume();else if(SP2.cur)pause();else{try{SFX.tap()}catch(er){}}}
    else if(b.classList.contains('spd2'))setSpd(+b.dataset.i);else setSpd((idx()+1)%SPD2.length)},true);
  function inject(){
    qa('.les-btns').forEach(x=>{if(!x.querySelector('.spbar2')){x.insertAdjacentHTML('afterbegin',BAR2)}});
    const bar=document.querySelector('#class .bar .sp');if(bar&&!document.querySelector('#class .bar .psbtn'))bar.insertAdjacentHTML('afterend','<button class="btn psbtn" data-short="1">✋ 暫停</button><button class="btn spdbtn" data-short="1"></button>');
    sync();
  }
  let iq=0;try{new MutationObserver(()=>{if(!iq)iq=requestAnimationFrame(()=>{iq=0;inject()})}).observe(document.getElementById('app')||document.body,{childList:true,subtree:true})}catch(e){}
  setTimeout(inject,0);
}

/* ---------- 4. 五年級（1～4單元）：解說、上課加上「說話速度」按鈕 ---------- */
if(GEN==='B'){
  const SPDB=[[0.7,'🐢 慢'],[0.85,'🚶 中'],[1,'🐇 快']];
  const idx=()=>{let k=0,d=9;SPDB.forEach((x,i)=>{const dd=Math.abs(x[0]-S.rate);if(dd<d){d=dd;k=i}});return k};
  const lab=()=>`<span class="sl">說話速度</span><span class="sv">${SPDB[idx()][1]}</span>`;
  function sync(){qa('.exspd').forEach(b=>b.innerHTML=lab())}
  function inject(){
    const ep=document.getElementById('exPause');if(ep&&!document.getElementById('exSpd')){ep.insertAdjacentHTML('afterend','<button class="btn exspd" id="exSpd"></button>');ep.textContent=ep.textContent.replace(/^[✋▶]\s*/,'')}
    const lp=document.getElementById('lsPause');if(lp&&!document.getElementById('lsSpd'))lp.insertAdjacentHTML('afterend','<button class="btn exspd" id="lsSpd"></button>');
    sync();
  }
  document.addEventListener('click',e=>{const b=e.target.closest('.exspd');if(!b)return;e.stopPropagation();if(!guard(250))return;
    S.rate=SPDB[(idx()+1)%SPDB.length][0];try{sset(KEYP+'-rate',S.rate)}catch(er){}try{SFX.tap()}catch(er){}sync();
    if(!TTS.ok||!S.voice)return;},true);
  let iq=0;try{new MutationObserver(()=>{if(!iq)iq=requestAnimationFrame(()=>{iq=0;inject()})}).observe(document.getElementById('app')||document.body,{childList:true,subtree:true})}catch(e){}
  setTimeout(inject,0);
}

/* ---------- 5. 分數顯示：[算式/算式] 也可以排成上下的分數 ---------- */
if(GEN==='C'&&typeof txtHtml==='function'&&typeof fracHTML==='function'){
  const _t=txtHtml;
  txtHtml=function(s){s=String(s==null?'':s);if(s.indexOf('[')<0)return _t(s);
    return s.split(/(\[[^\[\]\/]+\/[^\[\]]+\])/).map(p=>{const m=p.match(/^\[([^\[\]\/]+)\/([^\[\]]+)\]$/);return m?fracHTML(_t(m[1]),_t(m[2])):_t(p)}).join('')};
  if(typeof spoken==='function'){const _s=spoken;spoken=function(s){return _s(String(s).replace(/\[([^\[\]\/]+)\/([^\[\]]+)\]/g,'$2分之$1'))}}
}
})();
